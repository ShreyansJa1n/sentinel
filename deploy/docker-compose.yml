# Local dependencies for Sentinel. Not yet validated end to end: adjust as you build.
services:
  kafka:
    image: apache/kafka:3.8.1          # single node, KRaft mode
    ports: ["9092:9092"]

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]

  cassandra:
    image: cassandra:4.1
    ports: ["9042:9042"]
    environment:
      MAX_HEAP_SIZE: 1G                # cap heap for laptops
      HEAP_NEWSIZE: 256M

  prometheus:
    image: prom/prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
